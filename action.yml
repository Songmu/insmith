name: Set up insmith
description: Install insmith and add it to PATH
author: "Songmu"

runs:
  using: composite
  steps:
    - name: Install insmith
      shell: bash
      run: |
        version="v0.0.3"
        bindir="${RUNNER_TEMP%/}/insmith/bin"

        sh "${GITHUB_ACTION_PATH}/install.sh" \
          -b "${bindir}" "${version}"
        echo "${bindir}" >> "${GITHUB_PATH}"

branding:
  icon: package
  color: blue
